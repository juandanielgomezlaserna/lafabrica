<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Fábrica | Manizales</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        brand: ['Bebas Neue', 'cursive'],
                        body: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0f0f0f] text-white font-body min-h-screen flex flex-col">

    <header class="fixed w-full z-50 transition-all">
        <nav class="px-6 py-4 flex justify-between items-center bg-black/80 backdrop-blur-md border-b border-white/5">
            <div class="flex items-center gap-4">
                <div class="w-[50px] h-[50px] bg-[#e31e24] rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(227,30,36,0.4)] overflow-hidden border-2 border-[#e31e24]">
                    <img src="/assets/image.png" alt="Logo La Fábrica" class="w-full h-full object-cover">
                </div>
                <span class="font-brand text-2xl tracking-widest">LA FÁBRICA</span>
            </div>
            
            <div class="hidden md:flex gap-8 text-sm font-bold tracking-tighter uppercase">
                <a href="index.html" class="text-[#e31e24]">Inicio</a>
                <a href="menu.html" class="hover:text-[#e31e24] transition-colors">Menú</a>
                <a href="#" class="hover:text-[#e31e24] transition-colors">Ubicación</a>
            </div>

            <button class="bg-white text-black px-4 py-2 md:px-5 md:py-2 rounded-full font-bold text-[10px] md:text-xs uppercase hover:bg-[#e31e24] hover:text-white transition-all transform active:scale-95">
                Pide Ahora
            </button>
        </nav>

        <div class="md:hidden flex justify-around items-center bg-[#1a1a1a]/90 backdrop-blur-md border-b border-white/10 py-3 text-[10px] font-bold uppercase tracking-[0.2em]">
            <a href="index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1 transition-colors">
                <i class="fas fa-home text-base"></i>
                Inicio
            </a>
            <a href="menu.html" class="text-[#e31e24] flex flex-col items-center gap-1">
                <i class="fas fa-utensils text-base"></i>
                Menú
            </a>
            <a href="#" class="text-gray-400 hover:text-white flex flex-col items-center gap-1 transition-colors">
                <i class="fas fa-map-marker-alt text-base"></i>
                Ubicación
            </a>
        </div>
    </header>

    <div class="h-[110px] md:h-[72px]"></div>

    <main class="relative flex-grow flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-black/80 to-[#0f0f0f] z-10"></div>
            <img src="https://images.unsplash.com/photo-1550950158-d0d960dff51b?auto=format&fit=crop&q=80&w=1600" 
                 class="w-full h-full object-cover" alt="Background Industrial">
        </div>
        
        <div class="absolute top-40 left-10 opacity-5 hidden lg:block">
            <i class="fas fa-utensils text-[12rem]"></i>
        </div>
        <div class="absolute bottom-20 right-10 opacity-5 hidden lg:block">
            <i class="fas fa-hamburger text-[15rem]"></i>
        </div>

        <div class="relative z-20 text-center px-6 max-w-5xl py-12 md:py-20">
            <span class="inline-block bg-[#e31e24] text-white px-6 py-1 rounded-sm font-bold text-xs md:text-sm tracking-[0.4em] mb-6 md:mb-8 animate-pulse shadow-lg">
                MANIZALES
            </span>

            <h1 class="font-brand text-6xl md:text-[10rem] leading-none mb-6 drop-shadow-[0_10px_10px_rgba(0,0,0,0.5)]">
                100% <span class="text-[#e31e24]">ARTESANAL</span>
            </h1>

            <p class="text-gray-300 text-base md:text-2xl font-light max-w-2xl mx-auto mb-10 md:mb-12 leading-relaxed italic">
                "Cocinamos para tus eventos. Hamburguesas, conos de patacón, arepas y mucho más en la Recta de San Jorge."
            </p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="menu.html" class="w-full sm:w-auto group relative px-10 py-4 md:py-5 bg-[#e31e24] rounded-2xl overflow-hidden transition-all hover:shadow-[0_0_30px_rgba(227,30,36,0.5)] hover:-translate-y-1">
                    <span class="relative z-10 font-bold text-lg md:text-xl flex items-center justify-center gap-3">
                        VER EL MENÚ <i class="fas fa-arrow-right group-hover:translate-x-2 transition-transform"></i>
                    </span>
                </a>
                <a href="https://wa.me/3226386011" target="_blank" class="w-full sm:w-auto px-10 py-4 md:py-5 border-2 border-white/20 rounded-2xl font-bold text-lg md:text-xl hover:bg-white hover:text-black transition-all flex items-center justify-center gap-3 backdrop-blur-sm">
                    <i class="fab fa-whatsapp text-green-500 text-2xl"></i> DOMICILIOS
                </a>
            </div>
        </div>

        <div class="absolute inset-0 opacity-10 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/asfalt-dark.png')]"></div>
    </main>

    <footer class="w-full bg-black/80 backdrop-blur-xl border-t border-white/10 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-8">
            <div class="flex flex-col md:flex-row items-center gap-6 md:gap-8 text-[10px] md:text-sm text-gray-400 font-bold uppercase tracking-[0.2em]">
                <div class="flex items-center gap-3">
                    <i class="fas fa-clock text-[#e31e24] text-lg"></i>
                    <span>5PM - 12AM</span>
                </div>
                <div class="hidden md:block w-[1px] h-4 bg-white/20"></div>
                <div class="flex items-center gap-3 text-center md:text-left">
                    <i class="fas fa-map-marker-alt text-[#e31e24] text-lg"></i>
                    <span>SAN JORGE, MANIZALES</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <a href="#" class="text-gray-400 hover:text-[#e31e24] transition-all text-2xl">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="#" class="text-gray-400 hover:text-[#e31e24] transition-all text-2xl">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <span class="text-[10px] text-gray-600 font-bold tracking-widest uppercase">© 2026 La Fábrica</span>
            </div>
        </div>
    </footer>

</body>
</html>
