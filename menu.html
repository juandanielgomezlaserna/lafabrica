<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Artesanal | La Fábrica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        brand: ['Bebas Neue', 'cursive'],
                        body: ['Montserrat', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-8px); border-color: rgba(227, 30, 36, 0.3); }
        #cart-sidebar { transition: transform 0.4s shadow 0.4s; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white font-body min-h-screen flex flex-col overflow-x-hidden">

    <header class="fixed w-full z-[100] top-0">
        <nav class="px-6 py-4 flex justify-between items-center bg-black/80 backdrop-blur-md border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-[#e31e24] rounded-full flex items-center justify-center overflow-hidden border-2 border-[#e31e24] shadow-[0_0_20px_rgba(227,30,36,0.3)]">
                    <img src="/assets/image.png" alt="Logo" class="w-full h-full object-cover">
                </div>
                <span class="font-brand text-2xl md:text-3xl tracking-widest">LA FÁBRICA</span>
            </div>
            
            <div class="hidden md:flex gap-8 text-sm font-bold tracking-tighter uppercase">
                <a href="index.html" class="hover:text-[#e31e24] transition-colors">Inicio</a>
                <a href="menu.html" class="text-[#e31e24]">Menú</a>
                <a href="#" class="hover:text-[#e31e24] transition-colors">Ubicación</a>
            </div>

            <button class="bg-white text-black px-4 py-2 md:px-5 md:py-2 rounded-full font-bold text-[10px] md:text-xs uppercase hover:bg-[#e31e24] hover:text-white transition-all transform active:scale-95">
                Pide Ahora
            </button>
        </nav>

        <div class="md:hidden flex justify-around items-center bg-[#161616] border-b border-white/10 py-4 text-[11px] font-bold uppercase tracking-[0.2em]">
            <a href="index.html" class="text-gray-400 hover:text-white transition-colors">Inicio</a>
            <a href="menu.html" class="text-[#e31e24]">Menú</a>
            <a href="#" class="text-gray-400 hover:text-white transition-colors">Ubicación</a>
        </div>
    </header>

    <div class="h-[120px] md:h-[85px]"></div>

    <main class="flex-grow py-12 px-6 max-w-7xl mx-auto w-full relative z-10">
        <header class="text-center mb-12">
            <h1 class="font-brand text-7xl md:text-[10rem] leading-none mb-4 uppercase">
                Nuestro <span class="text-[#e31e24]">Menú</span>
            </h1>
            <div class="w-24 h-1 bg-[#e31e24] mx-auto mb-6"></div>
        </header>

        <div class="flex gap-3 overflow-x-auto pb-8 mb-10 no-scrollbar md:justify-center">
            <button onclick="filterMenu('todos', this)" class="filter-btn bg-[#e31e24] px-8 py-3 rounded-full font-bold whitespace-nowrap shadow-lg shadow-red-900/20 transition-all">Todos</button>
            <button onclick="filterMenu('hamburguesa', this)" class="filter-btn bg-white/5 border border-white/10 px-8 py-3 rounded-full font-bold whitespace-nowrap hover:bg-white/10 transition-all">Hamburguesas</button>
            <button onclick="filterMenu('cono', this)" class="filter-btn bg-white/5 border border-white/10 px-8 py-3 rounded-full font-bold whitespace-nowrap hover:bg-white/10 transition-all">Conos</button>
            <button onclick="filterMenu('bebida', this)" class="filter-btn bg-white/5 border border-white/10 px-8 py-3 rounded-full font-bold whitespace-nowrap hover:bg-white/10 transition-all">Bebidas</button>
        </div>

        <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="product-card bg-[#161616] rounded-[2.5rem] overflow-hidden border border-white/5 group" data-category="hamburguesa">
                <div class="relative h-72 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?q=80&w=500" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute bottom-4 left-4 bg-black/80 backdrop-blur-md px-5 py-2 rounded-2xl border border-white/10">
                        <span class="text-[#e31e24] font-bold text-xl">$26.000</span>
                    </div>
                </div>
                <div class="p-8">
                    <h3 class="font-brand text-4xl mb-6 tracking-wide text-center uppercase">La Industrial</h3>
                    <button onclick="addToCart('La Industrial', 26000)" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-[#e31e24] hover:text-white transition-all transform active:scale-95 flex items-center justify-center gap-2">
                         AGREGAR AL PEDIDO
                    </button>
                </div>
            </div>

            <div class="product-card bg-[#161616] rounded-[2.5rem] overflow-hidden border border-white/5 group" data-category="cono">
                <div class="relative h-72 overflow-hidden">
                    <img src="https://images.hive.blog/0x0/https://files.peakd.com/file/peakd-hive/yiobri/23wMm2qaxGaG3cswRrmJXZgQngMp9brFmKWzuucutauJ6JX1Ry47J6CCdswLjvfXmRWNa.jpg" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute bottom-4 left-4 bg-black/80 backdrop-blur-md px-5 py-2 rounded-2xl border border-white/10">
                        <span class="text-[#e31e24] font-bold text-xl">$19.500</span>
                    </div>
                </div>
                <div class="p-8">
                    <h3 class="font-brand text-4xl mb-6 tracking-wide text-center uppercase">Cono Criollo</h3>
                    <button onclick="addToCart('Cono Criollo', 19500)" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-[#e31e24] hover:text-white transition-all transform active:scale-95 flex items-center justify-center gap-2">
                         AGREGAR AL PEDIDO
                    </button>
                </div>
            </div>

            <div class="product-card bg-[#161616] rounded-[2.5rem] overflow-hidden border border-white/5 group" data-category="bebida">
                <div class="relative h-72 overflow-hidden">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmk-feoqIBVue-wHU0RJyBPHKmyRyDuEimQw&s" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                    <div class="absolute bottom-4 left-4 bg-black/80 backdrop-blur-md px-5 py-2 rounded-2xl border border-white/10">
                        <span class="text-[#e31e24] font-bold text-xl">$8.500</span>
                    </div>
                </div>
                <div class="p-8">
                    <h3 class="font-brand text-4xl mb-6 tracking-wide text-center uppercase">Soda Frutal</h3>
                    <button onclick="addToCart('Soda Frutal', 8500)" class="w-full bg-white text-black font-bold py-4 rounded-2xl hover:bg-[#e31e24] hover:text-white transition-all transform active:scale-95 flex items-center justify-center gap-2">
                         AGREGAR AL PEDIDO
                    </button>
                </div>
            </div>
        </div>
    </main>

    <button onclick="toggleCart()" class="fixed bottom-6 right-6 z-[999] w-16 h-16 bg-[#e31e24] rounded-full shadow-[0_10px_40px_rgba(227,30,36,0.6)] flex items-center justify-center transform active:scale-90 transition-all border-2 border-white/20 group">
        <i class="fas fa-shopping-basket text-2xl text-white group-hover:rotate-12 transition-transform"></i>
        <span id="cart-count-mob" class="absolute -top-1 -right-1 bg-white text-black text-[12px] font-bold w-7 h-7 rounded-full flex items-center justify-center border-2 border-[#e31e24] animate-bounce">0</span>
    </button>

    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full md:w-[450px] bg-[#0c0c0c] z-[1001] transform translate-x-full border-l border-white/10 shadow-[-20px_0_60px_rgba(0,0,0,0.9)]">
        <div class="p-8 h-full flex flex-col">
            <div class="flex justify-between items-center mb-10">
                <div>
                    <h2 class="font-brand text-5xl text-[#e31e24] leading-none uppercase tracking-tighter">Mi Pedido</h2>
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-2">Artesanía lista para llevar</p>
                </div>
                <button onclick="toggleCart()" class="w-12 h-12 rounded-full border border-white/10 flex items-center justify-center hover:bg-white hover:text-black transition-all">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                <div class="text-center py-20 opacity-20">
                    <i class="fas fa-shopping-basket text-8xl mb-4"></i>
                    <p class="italic font-bold tracking-widest uppercase text-xs">El carrito está vacío</p>
                </div>
            </div>

            <div class="border-t border-white/10 pt-8 mt-6">
                <div class="flex justify-between items-end mb-8">
                    <span class="text-gray-400 font-bold text-xs uppercase tracking-widest">Total del pedido</span>
                    <span id="cart-total" class="text-5xl font-brand text-white tracking-tighter">$0</span>
                </div>
                <button onclick="checkout()" class="w-full bg-[#e31e24] py-6 rounded-3xl font-bold text-xl hover:shadow-[0_0_30px_rgba(227,30,36,0.4)] transition-all flex items-center justify-center gap-3 active:scale-95">
                    <i class="fab fa-whatsapp text-2xl"></i> PEDIR POR WHATSAPP
                </button>
            </div>
        </div>
    </div>

    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/90 z-[1000] hidden backdrop-blur-sm transition-opacity"></div>

    <script>
        let cart = [];

        function filterMenu(category, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('bg-[#e31e24]', 'shadow-lg', 'shadow-red-900/20');
                b.classList.add('bg-white/5');
            });
            btn.classList.add('bg-[#e31e24]', 'shadow-lg', 'shadow-red-900/20');

            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
                card.style.display = (category === 'todos' || card.getAttribute('data-category') === category) ? 'block' : 'none';
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price, id: Date.now() });
            updateCartUI();
            
            // Animación del contador
            const mobCount = document.getElementById('cart-count-mob');
            mobCount.classList.remove('animate-bounce');
            void mobCount.offsetWidth; // Trigger reflow
            mobCount.classList.add('animate-bounce');
        }

        function updateCartUI() {
            const container = document.querySelector('#cart-items');
            const totalLabel = document.querySelector('#cart-total');
            const mobCount = document.querySelector('#cart-count-mob');
            
            mobCount.innerText = cart.length;
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 opacity-20">
                        <i class="fas fa-shopping-basket text-8xl mb-4"></i>
                        <p class="italic uppercase text-xs tracking-widest">Carrito vacío</p>
                    </div>`;
                totalLabel.innerText = "$0";
                return;
            }

            container.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center bg-white/5 p-5 rounded-3xl border border-white/5 transition-all hover:bg-white/10">
                    <div>
                        <p class="font-bold uppercase text-[11px] tracking-widest text-gray-400 mb-1">${item.name}</p>
                        <p class="text-[#e31e24] font-brand text-2xl">$${item.price.toLocaleString()}</p>
                    </div>
                    <button onclick="removeFromCart(${index})" class="w-10 h-10 rounded-full flex items-center justify-center bg-white/5 hover:bg-red-600 hover:text-white transition-colors">
                        <i class="fas fa-trash-alt text-xs"></i>
                    </button>
                </div>
            `).join('');

            const sum = cart.reduce((acc, item) => acc + item.price, 0);
            totalLabel.innerText = `$${sum.toLocaleString()}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            const sidebar = document.querySelector('#cart-sidebar');
            const overlay = document.querySelector('#overlay');
            const isHidden = sidebar.classList.contains('translate-x-full');
            
            if(isHidden) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('hidden');
            }
        }

        function checkout() {
            if(cart.length === 0) return alert("¡Tu pedido está vacío!");
            const message = cart.map(i => `• ${i.name} ($${i.price.toLocaleString()})`).join('%0A');
            const total = cart.reduce((acc, item) => acc + item.price, 0);
            const finalMessage = `¡Hola La Fábrica! 👋%0AQuiero realizar el siguiente pedido:%0A%0A${message}%0A%0A*Total: $${total.toLocaleString()}*%0A%0A¿Me confirman para enviar los datos de entrega? 🍔`;
            window.open(`https://wa.me/3226386011?text=${finalMessage}`, '_blank');
        }
    </script>

</body>
</html>
